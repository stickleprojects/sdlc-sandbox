# The CI half of the stack contract (the other half is the Makefile).
# Node for the app; the pipeline's tool needs only the runner's python3.
name: Setup stack
description: Install the language toolchain and project dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: make setup
